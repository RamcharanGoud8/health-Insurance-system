version: '3.8'

services:

  # ─────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: Ramcharan8@
      MYSQL_DATABASE: his_project
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - his-network

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - his-network

  # ─────────────────────────────────────────────
  # ELK STACK
  # ─────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - his-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    networks:
      - his-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'available'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - his-network

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - his-logs:/var/log/his:ro
    depends_on:
      - logstash
    networks:
      - his-network
    

    # ─────────────────────────────────────────────
  # SPRING CLOUD INFRASTRUCTURE
  # ─────────────────────────────────────────────

  discovery-server:
    build: ./discoveryserver
    container_name: discovery-server
    ports:
      - "8761:8761"
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - his-logs:/var/log/his
    networks:
      - his-network

  config-server:
    build: ./configserver
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - his-logs:/var/log/his
    networks:
      - his-network

  # ─────────────────────────────────────────────
  # HIS MICROSERVICES
  # ─────────────────────────────────────────────

  api-gateway:
    build: ./apigateway
    container_name: api-gateway
    ports:
      - "8765:8765"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - LOGGING_FILE_NAME=/var/log/his/api-gateway/application.log
    volumes:
      - his-logs:/var/log/his
    networks:
      - his-network

  auth-service:
    build: ./Authservice
    container_name: auth-service
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - LOGGING_FILE_NAME=/var/log/his/auth-service/application.log
    volumes:
      - his-logs:/var/log/his
    networks:
      - his-network

  application-registration:
    build: ./applicationregistration
    container_name: application-registration
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - LOGGING_FILE_NAME=/var/log/his/application-registration/application.log
    volumes:
      - his-logs:/var/log/his
    networks:
      - his-network

  data-collection:
    build: ./datacollection
    container_name: data-collection
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - LOGGING_FILE_NAME=/var/log/his/data-collection/application.log
    volumes:
      - his-logs:/var/log/his
    networks:
      - his-network

  eligibility-determination:
    build: ./eligibilitydetermination
    container_name: eligibility-determination
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - LOGGING_FILE_NAME=/var/log/his/eligibility-determination/application.log
    volumes:
      - his-logs:/var/log/his
    networks:
      - his-network

  benefit-issuance:
    build: ./benifitIssuance
    container_name: benefit-issuance
    ports:
      - "9096:9096"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - LOGGING_FILE_NAME=/var/log/his/benefit-issuance/application.log
    volumes:
      - his-logs:/var/log/his
    networks:
      - his-network

  correspondence:
    build: ./correspondance
    container_name: correspondence
    ports:
      - "9095:9095"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - LOGGING_FILE_NAME=/var/log/his/correspondence/application.log
    volumes:
      - C:/HIS_NOTICES:/HIS_NOTICES
      - his-logs:/var/log/his
    networks:
      - his-network

networks:
  his-network:
    driver: bridge

volumes:
  mysql-data:
  elasticsearch-data:
  his-logs:
