input {
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON logs from Spring Boot (Logstash JSON encoder)
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }

  # Add service name tag from Filebeat field
  if [fields][service] {
    mutate {
      add_field => { "service_name" => "%{[fields][service]}" }
    }
  }

  # Parse log level
  if [level] {
    mutate {
      add_field => { "log_level" => "%{level}" }
    }
  }

  # Extract traceId and spanId for distributed tracing correlation with Zipkin
  if [traceId] {
    mutate {
      add_field => { "trace_id" => "%{traceId}" }
      add_field => { "span_id" => "%{spanId}" }
    }
  }

  # Timestamp normalization
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Remove redundant fields
  mutate {
    remove_field => ["agent", "ecs", "input", "log", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "his-logs-%{[service_name]}-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
